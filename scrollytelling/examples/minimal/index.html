<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrollytelling adapter minimal example</title>
    <script type="importmap">
      { "imports": { "visdelta/composition": "/dist/composition.js" } }
    </script>
    <link rel="stylesheet" href="../../dist/scrollytelling.css" />
    <link rel="stylesheet" href="../../../dist/themes/default.css" />
  </head>
  <body>
    <main id="app"></main>

    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/arquero@8/dist/arquero.min.js"></script>
    <script type="module">
      import { createStory, story } from "../../dist/index.js";
      import { bar } from "../../../dist/bar.js";

      const spec = story()
        .title("Revenue")
        .data("rows", {
          values: [
            { category: "A", value: 12 },
            { category: "B", value: 18 },
            { category: "C", value: 9 }
          ]
        })
        .view("main", { height: 420 })
        .add("Baseline", bar("rows")
          .x("category")
          .y("value")
          .key("category"))
        .add("Highlight B", bar("rows")
          .x("category")
          .y("value")
          .key("category")
          .highlight({ category: "B" }))
        .toSpec();

      await createStory(spec, { target: "#app", d3: window.d3, aq: window.aq });
    </script>
  </body>
</html>
