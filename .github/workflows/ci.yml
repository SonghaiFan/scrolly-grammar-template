name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      # The published ESM package supports Node 18 consumers; browser test
      # tooling requires Node 20+, so test consumption separately after build.
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm run pack:check
