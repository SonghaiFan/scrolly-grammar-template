<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VisDelta documentation</title>
    <meta name="description" content="VisDelta declarative visualization transition documentation.">
  </head>
  <body>
    <p id="message">Opening the <a href="./docs/.vitepress/dist/">VisDelta documentation</a>…</p>
    <script>
      const target = new URL('./docs/.vitepress/dist/', location.href);
      target.search = location.search;
      if (location.protocol === 'file:') {
        document.querySelector('#message').innerHTML = 'VisDelta now has one canonical VitePress site. Run <code>npm run docs:dev</code>, then open the local URL printed in your terminal.';
      } else {
        location.replace(target.href);
      }
    </script>
  </body>
</html>
